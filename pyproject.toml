[project]
name = "inference-tracker"
dynamic = ["version"]
description = "Per-user inference cost for AI apps"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "google-cloud-aiplatform>=2.6.0",
    "google-genai>=2.32.0",
    "httpx>=0.28.1",
    "litellm>=1.106.2",
    "openai>=3.36.1",
    "openai-agents>=0.24.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/inference_tracker/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_tracker"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
