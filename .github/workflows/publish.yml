# Publishes the library to PyPI when a version tag (v0.9.4) is pushed. Uses PyPI's trusted publishing:
# PyPI trusts this workflow, so no token is stored anywhere.
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/inference_tracker/_version.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, version $version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
